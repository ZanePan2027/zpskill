<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">人生搭子与共同记忆</title><desc id="desc">听你讲，记住共同经历，理解变化，一起修正，下次继续。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#173F35" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="24" fill="#F7F4EC"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Arial,sans-serif"><text x="56" y="54" font-size="15" fill="#173F35" font-weight="650">ZPSKILL / 共同记忆</text><text x="56" y="113" font-size="34" fill="#173F35" font-weight="700">你们经历的事，让搭子越来越懂你</text><text x="56" y="155" font-size="18" fill="#596C62" font-weight="400">你照常讲生活，搭子把有用的背景、成果与变化留在你授权的工作台。</text><rect x="56" y="208" width="328" height="185" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="81" y="243" font-size="14" fill="#B44D35" font-weight="650">01</text><text x="81" y="289" font-size="26" fill="#173F35" font-weight="650">听你讲新的事</text><text x="81" y="328" font-size="18" fill="#596C62" font-weight="400">对话、文件、经历或新反馈</text><text x="81" y="357" font-size="18" fill="#596C62" font-weight="400">从你此刻想说的地方开始</text><rect x="436" y="208" width="328" height="185" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="461" y="243" font-size="14" fill="#B44D35" font-weight="650">02</text><text x="461" y="289" font-size="26" fill="#173F35" font-weight="650">留下共同经历</text><text x="461" y="328" font-size="18" fill="#596C62" font-weight="400">保留原话和出处，细节有来处</text><text x="461" y="357" font-size="18" fill="#596C62" font-weight="400">哪些值得记住，由你决定</text><rect x="816" y="208" width="328" height="185" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="841" y="243" font-size="14" fill="#B44D35" font-weight="650">03</text><text x="841" y="289" font-size="26" fill="#173F35" font-weight="650">认识你的变化</text><text x="841" y="328" font-size="18" fill="#596C62" font-weight="400">愿望、关系、资源与处境</text><text x="841" y="357" font-size="18" fill="#596C62" font-weight="400">把新信息放回你的生活里</text><rect x="816" y="438" width="328" height="185" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="841" y="473" font-size="14" fill="#B44D35" font-weight="650">04</text><text x="841" y="519" font-size="26" fill="#173F35" font-weight="650">一起修正想法</text><text x="841" y="558" font-size="18" fill="#596C62" font-weight="400">事实变了，就改原来的判断</text><text x="841" y="587" font-size="18" fill="#596C62" font-weight="400">你说记错了，就按新事实改</text><rect x="436" y="438" width="328" height="185" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="461" y="473" font-size="14" fill="#B44D35" font-weight="650">05</text><text x="461" y="519" font-size="26" fill="#173F35" font-weight="650">保留走过的路</text><text x="461" y="558" font-size="18" fill="#596C62" font-weight="400">当前成果、进展和下一步</text><text x="461" y="587" font-size="18" fill="#596C62" font-weight="400">看见什么真的帮到了你</text><rect x="56" y="438" width="328" height="185" rx="18" fill="#DDE9DB" stroke="#C4D0C2"/><text x="81" y="473" font-size="14" fill="#B44D35" font-weight="650">06</text><text x="81" y="519" font-size="26" fill="#173F35" font-weight="650">下次接着走</text><text x="81" y="558" font-size="18" fill="#596C62" font-weight="400">找回共同背景和停下的位置</text><text x="81" y="587" font-size="18" fill="#596C62" font-weight="400">从这一次的生活继续</text><path d="M394 300H422" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M774 300H802" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M980 403V425" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M806 530H779" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M426 530H399" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M41 530H24V300H42" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><text x="56" y="705" font-size="20" fill="#173F35" font-weight="500">陪伴会积累，也会改变；当前的理解，跟着真实的你一起生长。</text></g></svg>
