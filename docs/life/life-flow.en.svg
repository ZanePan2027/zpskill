<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">How your forever AI buddy stays by your side</title><desc id="desc">Know your life, think together, act together, and continue with shared experience.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#173F35" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="24" fill="#F7F4EC"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Arial,sans-serif"><text x="56" y="54" font-size="15" fill="#173F35" font-weight="650">ZPSKILL / YOUR FOREVER AI BUDDY</text><text x="56" y="113" font-size="32" fill="#173F35" font-weight="700">A life together starts with knowing you.</text><text x="56" y="155" font-size="18" fill="#596C62" font-weight="400">Bring your life as it is. Think together, do things together, and keep going.</text><rect x="56" y="205" width="508" height="190" rx="18" fill="#DDE9DB" stroke="#C4D0C2"/><text x="81" y="240" font-size="14" fill="#B44D35" font-weight="650">01</text><text x="81" y="286" font-size="23" fill="#173F35" font-weight="650">Know the life you want</text><text x="81" y="325" font-size="17" fill="#596C62" font-weight="400">Your experiences, wishes, and choices</text><text x="81" y="354" font-size="17" fill="#596C62" font-weight="400">Your current stage and circumstances</text><rect x="636" y="205" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="661" y="240" font-size="14" fill="#B44D35" font-weight="650">02</text><text x="661" y="286" font-size="23" fill="#173F35" font-weight="650">Think through choices</text><text x="661" y="325" font-size="17" fill="#596C62" font-weight="400">Explore possible futures and routes</text><text x="661" y="354" font-size="17" fill="#596C62" font-weight="400">Plan the time, effort, and next step</text><rect x="636" y="440" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="661" y="475" font-size="14" fill="#B44D35" font-weight="650">03</text><text x="661" y="521" font-size="23" fill="#173F35" font-weight="650">Do things together</text><text x="661" y="560" font-size="17" fill="#596C62" font-weight="400">A message, a résumé, a first step</text><text x="661" y="589" font-size="17" fill="#596C62" font-weight="400">Or simply listen and make room for rest</text><rect x="56" y="440" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="81" y="475" font-size="14" fill="#B44D35" font-weight="650">04</text><text x="81" y="521" font-size="23" fill="#173F35" font-weight="650">Keep growing together</text><text x="81" y="560" font-size="17" fill="#596C62" font-weight="400">Bring back what happened and revise</text><text x="81" y="589" font-size="17" fill="#596C62" font-weight="400">Keep useful context; pick up next time</text><path d="M573 300H621" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 404V427" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M626 535H579" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 535H24V300H42" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><text x="56" y="705" font-size="20" fill="#173F35" font-weight="500">You decide what makes life worth living. Your buddy walks with you.</text></g></svg>
