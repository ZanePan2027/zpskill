<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">人生搭子怎样陪你过好人生</title><desc id="desc">认识生活、一起选择、一起行动、根据共同经历继续。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#173F35" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="24" fill="#F7F4EC"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Arial,sans-serif"><text x="56" y="54" font-size="15" fill="#173F35" font-weight="650">ZPSKILL / 人生搭子</text><text x="56" y="113" font-size="34" fill="#173F35" font-weight="700">陪伴你过好人生，从认识你开始</text><text x="56" y="155" font-size="18" fill="#596C62" font-weight="400">你讲生活里的事，搭子陪你一起想、一起做，再接着往前走。</text><rect x="56" y="205" width="508" height="190" rx="18" fill="#DDE9DB" stroke="#C4D0C2"/><text x="81" y="240" font-size="14" fill="#B44D35" font-weight="650">01</text><text x="81" y="286" font-size="26" fill="#173F35" font-weight="650">认识你想过的生活</text><text x="81" y="325" font-size="18" fill="#596C62" font-weight="400">你的经历、愿望与取舍</text><text x="81" y="354" font-size="18" fill="#596C62" font-weight="400">此刻的阶段、人和现实条件</text><rect x="636" y="205" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="661" y="240" font-size="14" fill="#B44D35" font-weight="650">02</text><text x="661" y="286" font-size="26" fill="#173F35" font-weight="650">陪你一起做选择</text><text x="661" y="325" font-size="18" fill="#596C62" font-weight="400">看看未来可能怎样，比较几条路</text><text x="661" y="354" font-size="18" fill="#596C62" font-weight="400">一起安排时间、投入与下一步</text><rect x="636" y="440" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="661" y="475" font-size="14" fill="#B44D35" font-weight="650">03</text><text x="661" y="521" font-size="26" fill="#173F35" font-weight="650">把眼前的事一起做成</text><text x="661" y="560" font-size="18" fill="#596C62" font-weight="400">一段沟通、一份简历、一个开始</text><text x="661" y="589" font-size="18" fill="#596C62" font-weight="400">需要时认真听你说，陪你歇一歇</text><rect x="56" y="440" width="508" height="190" rx="18" fill="#FFFEFA" stroke="#C4D0C2"/><text x="81" y="475" font-size="14" fill="#B44D35" font-weight="650">04</text><text x="81" y="521" font-size="26" fill="#173F35" font-weight="650">带着共同经历继续</text><text x="81" y="560" font-size="18" fill="#596C62" font-weight="400">把发生的事带回来，一起改判断</text><text x="81" y="589" font-size="18" fill="#596C62" font-weight="400">保存有用的理解，下次接着走</text><path d="M573 300H621" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 404V427" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M626 535H579" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 535H24V300H42" fill="none" stroke="#173F35" stroke-width="2" marker-end="url(#arrow)"/><text x="56" y="705" font-size="20" fill="#173F35" font-weight="500">你决定什么样的人生值得，搭子陪你把日子过成自己的样子。</text></g></svg>
