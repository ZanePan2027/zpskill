<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Your buddy, through your job search</title>
<desc id="desc">Start at any hiring task. Use relevant methods, get a result and continue with feedback.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}
.brand{font-size:15px;font-weight:700;letter-spacing:1.2px;fill:#173F35}.entry{font-family:"SFMono-Regular",Consolas,monospace;font-size:18px;fill:#173F35}
.title{font-size:38px;font-weight:700;fill:#173F35}.subtitle{font-size:20px;fill:#596C62}
.index{font-size:15px;font-weight:600;fill:#94a3b8}.label{font-size:23px;font-weight:700;fill:#173F35}.body{font-size:15px;fill:#596C62}
.strong .index{fill:#bfdbfe}.strong .label{fill:#fff}.strong .body{fill:#dbeafe}
.loop{font-size:16px;font-weight:600;fill:#173F35}.section{font-size:17px;fill:#596C62}.bottom-label{font-size:22px;font-weight:700;fill:#183153}.bottom-body{font-size:18px;fill:#596C62}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#173F35"/></marker>
</defs>
<rect width="1200" height="720" rx="20" fill="#F7F4EC"/>
<path d="M316 310H339" stroke="#173F35" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M588 310H611" stroke="#173F35" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M860 310H883" stroke="#173F35" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<path d="M1008 408V448Q1008 466 990 466H482Q464 466 464 448V414" fill="none" stroke="#C4D0C2" stroke-width="2" marker-end="url(#arrow)"/>
<g class="stage">
<rect x="72" y="212" width="240" height="196" rx="16" fill="#fff" stroke="#C4D0C2" stroke-width="1.5"/>
<text x="92" y="245" class="index" >01</text>
<text x="92" y="298" class="label" >Bring a task</text>
<text x="92" y="350" class="body" >A résumé, role or project</text>
<text x="92" y="377" class="body" >An interview or an offer</text>
</g>
<g class="strong">
<rect x="344" y="212" width="240" height="196" rx="16" fill="#173F35" stroke="#173F35" stroke-width="1.5"/>
<text x="364" y="245" class="index" >02</text>
<text x="364" y="298" class="label" >Use what fits</text>
<text x="364" y="350" class="body" >Resolve the gaps that matter</text>
<text x="364" y="377" class="body" >Work on the task directly</text>
</g>
<g class="stage">
<rect x="616" y="212" width="240" height="196" rx="16" fill="#fff" stroke="#C4D0C2" stroke-width="1.5"/>
<text x="636" y="245" class="index" >03</text>
<text x="636" y="298" class="label" >Get a result</text>
<text x="636" y="350" class="body" >Materials and messages</text>
<text x="636" y="377" class="body" >Practice or offer comparison</text>
</g>
<g class="stage">
<rect x="888" y="212" width="240" height="196" rx="16" fill="#fff" stroke="#C4D0C2" stroke-width="1.5"/>
<text x="908" y="245" class="index" >04</text>
<text x="908" y="298" class="label" >Use feedback</text>
<text x="908" y="350" class="body" >Replies, interviews, new facts</text>
<text x="908" y="377" class="body" >Revise and take the next step</text>
</g>
<rect x="596" y="451" width="280" height="30" rx="10" fill="#F7F4EC"/>
<text x="736" y="473" class="loop" text-anchor="middle">Correct facts, update the work</text>
<text x="72" y="520" class="section" >When you want to continue later</text>
<rect x="72" y="542" width="512" height="112" rx="16" fill="#DDE9DB" stroke="#C4D0C2"/>
<text x="96" y="584" class="bottom-label" >Save the current version</text>
<text x="96" y="621" class="bottom-body" >Keep the draft, key facts and pause point</text>
<rect x="616" y="542" width="512" height="112" rx="16" fill="#DDE9DB" stroke="#C4D0C2"/>
<text x="640" y="584" class="bottom-label" >Resume where you stopped</text>
<text x="640" y="621" class="bottom-body" >Use the existing project and current context</text>
<text x="72" y="57" class="brand" >ZPSKILL · A JOB-SEARCH BUDDY</text>
<rect x="790" y="31" width="338" height="38" rx="19" fill="#DDE9DB"/>
<text x="959" y="57" class="entry" text-anchor="middle">zp-career</text>
<text x="72" y="121" class="title" >Your buddy, through your job search</text>
<text x="72" y="164" class="subtitle" >From a résumé to a new opportunity, take each step together.</text>
</svg>
